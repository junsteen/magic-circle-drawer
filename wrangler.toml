name = "magic-circle-drawer"
pages_build_output_dir = "out"
compatibility_date = "2024-01-01"

[[kv_namespaces]]
binding = "REPLAY_KV"
id = "c81c78076a7246a2926374f7c58b42a1"

# アカシックレコード用D1データベース
# 初回セットアップ: wrangler d1 create akashic-record
# database_id は上記コマンド実行後に取得した値に置き換える
[[d1_databases]]
binding = "AKASHIC_DB"
database_name = "akashic-record"
database_id = "00000000-0000-0000-0000-000000000000"